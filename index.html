<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lane9 - Swim Goal Tracker</title>
    
    <!-- Dynamic Manifest for PWA -->
    <link id="manifest-link" rel="manifest" href="">
    <meta name="theme-color" content="#0284c7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js and Date Adapter -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        swim: {
                            dark: '#0f172a',
                            primary: '#0284c7', // sky-600
                            light: '#38bdf8', // sky-400
                            accent: '#2dd4bf', // teal-400
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f8fafc; }
        /* Hide scrollbar for a cleaner mobile app feel */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.7); /* slate-800 */
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 antialiased h-screen flex flex-col overflow-hidden bg-slate-50 dark:bg-slate-900 transition-colors duration-300">

    <!-- Navbar -->
    <header class="bg-swim-dark text-white p-4 shadow-lg shrink-0 z-10 relative">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <!-- LOGO: Update this src to your hosted Github raw URL -->
                <img src="https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/YOUR_REPO/main/logo.png" 
                     alt="Lane9 Logo" 
                     id="app-logo"
                     class="w-8 h-8 rounded bg-white p-0.5 object-cover"
                     onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 512 512\' fill=\'%230284c7\'><path d=\'M388.9 91.1c-22.7-22.7-59.5-22.7-82.2 0L193.3 204.4l-75-75c-22.7-22.7-59.5-22.7-82.2 0s-22.7 59.5 0 82.2L111 286.6 42.4 355.2c-15.6 15.6-15.6 40.9 0 56.6s40.9 15.6 56.6 0l68.6-68.6 75 75c22.7 22.7 59.5 22.7 82.2 0s22.7-59.5 0-82.2l-75-75L363.1 146c22.7-22.7 22.7-59.5 0-82.2zM276.4 336.5l-92.9-92.9L296.8 130.3l92.9 92.9-113.3 113.3zM256 0c141.4 0 256 114.6 256 256s-114.6 256-256 256S0 397.4 0 256 114.6 0 256 0z\'/></svg>'">
                <h1 class="text-xl font-bold tracking-tight">Lane<span class="text-swim-light">9</span></h1>
            </div>
            <div class="flex items-center gap-2 bg-slate-800 dark:bg-slate-950 rounded-lg p-1">
                <button id="theme-toggle-btn" class="p-2 text-slate-400 hover:text-white transition rounded-md" aria-label="Toggle Dark Mode"><i class="fa-solid fa-moon"></i></button>
                <div class="w-px h-6 bg-slate-700 mx-1"></div>
                <select id="event-selector" class="bg-transparent text-white border-none outline-none font-medium px-2 py-1 appearance-none cursor-pointer">
                    <!-- Populated by JS -->
                </select>
                <button id="add-event-btn" class="p-2 text-swim-accent hover:text-white transition rounded-md"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content Area (Scrollable) -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6">
        <div class="max-w-5xl mx-auto space-y-6 pb-20">

            <!-- Chart Section -->
            <section class="glass-panel rounded-2xl p-4 md:p-6 relative">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <h2 class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider" id="chart-title">100 Fly Progress</h2>
                        <div class="text-3xl font-bold text-swim-dark dark:text-white mt-1" id="pb-display">--:--.--</div>
                        <div class="text-xs text-slate-400">Personal Best</div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Target Goal</div>
                        <div class="text-xl font-bold text-swim-primary dark:text-swim-light mt-1" id="goal-display">--:--.--</div>
                    </div>
                </div>
                <div class="w-full h-[300px] md:h-[400px]">
                    <canvas id="progressChart"></canvas>
                </div>
            </section>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Paste Data Section -->
                <section class="glass-panel rounded-2xl p-4 md:p-6 flex flex-col">
                    <h3 class="text-lg font-bold text-slate-800 dark:text-white mb-2"><i class="fa-solid fa-paste text-swim-primary mr-2"></i>Import from Swimcloud</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Copy the table rows from your Swimcloud profile and paste them here.</p>
                    <textarea id="paste-area" class="w-full flex-1 min-h-[120px] p-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:ring-2 focus:ring-swim-primary focus:border-swim-primary outline-none resize-y transition-colors" placeholder="25.41    Wisconsin LSC Regional...    Feb 21, 2026&#10;..."></textarea>
                    <button id="process-data-btn" class="mt-4 w-full bg-swim-primary hover:bg-sky-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-md active:scale-95">Process Data</button>
                </section>

                <!-- Goal Setting Section -->
                <section class="glass-panel rounded-2xl p-4 md:p-6">
                    <h3 class="text-lg font-bold text-slate-800 dark:text-white mb-4"><i class="fa-solid fa-bullseye text-swim-accent mr-2"></i>Set a Goal</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Target Time (MM:SS.ms)</label>
                            <input type="text" id="goal-time-input" placeholder="e.g. 52.99 or 1:05.50" class="w-full p-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:ring-2 focus:ring-swim-primary focus:border-swim-primary outline-none transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Target Date</label>
                            <input type="date" id="goal-date-input" class="w-full p-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:ring-2 focus:ring-swim-primary focus:border-swim-primary outline-none transition-colors" style="color-scheme: light dark;">
                        </div>
                        <button id="save-goal-btn" class="w-full bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 dark:hover:bg-slate-600 text-white font-semibold py-3 px-4 rounded-xl transition shadow-md active:scale-95">Save Goal</button>
                    </div>
                </section>
            </div>

            <!-- History Table -->
            <section class="glass-panel rounded-2xl p-4 md:p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-slate-800 dark:text-white"><i class="fa-solid fa-clock-rotate-left text-slate-400 mr-2"></i>Time History</h3>
                    <button id="clear-data-btn" class="text-sm text-red-500 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 font-medium">Clear Event Data</button>
                </div>
                <div class="overflow-x-auto rounded-lg border border-slate-100 dark:border-slate-700">
                    <table class="w-full text-left text-sm text-slate-600 dark:text-slate-300">
                        <thead class="bg-slate-50 dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 uppercase text-xs">
                            <tr>
                                <th class="px-4 py-3 font-semibold">Date</th>
                                <th class="px-4 py-3 font-semibold">Time</th>
                                <th class="px-4 py-3 font-semibold hidden md:table-cell">Meet</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody" class="divide-y divide-slate-100 dark:divide-slate-700/50 bg-white dark:bg-slate-800">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                    <div id="no-data-msg" class="text-center p-6 text-slate-400 hidden">
                        No times recorded for this event yet.
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal for New Event -->
    <div id="new-event-modal" class="fixed inset-0 bg-slate-900/50 dark:bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-11/12 max-w-sm shadow-2xl transform scale-95 transition-transform" id="modal-content">
            <h3 class="text-xl font-bold mb-4 text-slate-800 dark:text-white">Add New Event</h3>
            <input type="text" id="new-event-input" placeholder="e.g. 50 Free, 200 IM" class="w-full p-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-700 dark:text-white mb-4 focus:ring-2 focus:ring-swim-primary outline-none">
            <div class="flex justify-end gap-3">
                <button id="cancel-event-btn" class="px-4 py-2 text-slate-500 dark:text-slate-400 font-medium hover:text-slate-700 dark:hover:text-slate-200">Cancel</button>
                <button id="save-event-btn" class="px-4 py-2 bg-swim-primary text-white font-medium rounded-lg hover:bg-sky-700">Create</button>
            </div>
        </div>
    </div>

    <!-- PWA & Application Logic -->
    <script>
        // --- PWA Setup ---
        const manifestStr = JSON.stringify({
            name: "Lane9",
            short_name: "Lane9",
            description: "Swim goal tracking and time visualization",
            start_url: window.location.href,
            display: "standalone",
            background_color: "#0f172a",
            theme_color: "#0284c7",
            icons: [{
                src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIiBmaWxsPSIjMDI4NGM3Ij48cGF0aCBkPSJNMzg4LjkgOTEuMWMtMjIuNy0yMi43LTU5LjUtMjIuNy04Mi4yIDBMMTkzLjMgMjA0LjRsLTc1LTc1Yy0yMi43LTIyLjctNTkuNS0yMi43LTgyLjIgMHMtMjIuNyA1OS41IDAgODIuMkwxMTEgMjg2LjYgNDIuNCAzNTUuMmMtMTUuNiAxNS42LTE1LjYgNDAuOSAwIDU2LjZzNDAuOSAxNS42IDU2LjYgMGw2OC42LTY4LjYgNzUgNzVjMjIuNyAyMi43IDU5LjUgMjIuNyA4Mi4yIDBzMjIuNy01OS41IDAtODIuMmwtNzUtNzVMMzYzLjEgMTQ2YzIyLjctMjIuNyAyMi43LTU5LjUgMC04Mi4yeiIvPjwvc3ZnPg==",
                sizes: "192x192",
                type: "image/svg+xml"
            }]
        });
        const manifestBlob = new Blob([manifestStr], { type: 'application/manifest+json' });
        document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

        // Dummy Service worker for PWA installability requirements
        const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => self.clients.claim());
            self.addEventListener('fetch', (e) => {});
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(console.warn);
        }

        // --- App Logic ---
        
        // Data Structure
        let appData = {
            currentEvent: "100 Fly",
            events: {
                "100 Fly": { times: [], goal: null }
            }
        };

        // DOM Elements
        const DOM = {
            eventSelector: document.getElementById('event-selector'),
            addEventBtn: document.getElementById('add-event-btn'),
            themeToggleBtn: document.getElementById('theme-toggle-btn'),
            pbDisplay: document.getElementById('pb-display'),
            goalDisplay: document.getElementById('goal-display'),
            chartTitle: document.getElementById('chart-title'),
            pasteArea: document.getElementById('paste-area'),
            processDataBtn: document.getElementById('process-data-btn'),
            goalTimeInput: document.getElementById('goal-time-input'),
            goalDateInput: document.getElementById('goal-date-input'),
            saveGoalBtn: document.getElementById('save-goal-btn'),
            historyTbody: document.getElementById('history-tbody'),
            noDataMsg: document.getElementById('no-data-msg'),
            clearDataBtn: document.getElementById('clear-data-btn'),
            
            // Modal
            modal: document.getElementById('new-event-modal'),
            modalContent: document.getElementById('modal-content'),
            newEventInput: document.getElementById('new-event-input'),
            cancelEventBtn: document.getElementById('cancel-event-btn'),
            saveEventBtn: document.getElementById('save-event-btn'),
        };

        let progressChart = null;

        // Initialize App
        function init() {
            initTheme();
            loadData();
            populateEventSelector();
            setupEventListeners();
            renderApp();
        }

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                DOM.themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            } else {
                document.documentElement.classList.remove('dark');
                DOM.themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                DOM.themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                DOM.themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            }
            // Re-render chart to update colors
            if (appData.events[appData.currentEvent]) {
                renderChart(appData.events[appData.currentEvent]);
            }
        }

        function loadData() {
            const saved = localStorage.getItem('lane9_data');
            if (saved) {
                appData = JSON.parse(saved);
            }
        }

        function saveData() {
            localStorage.setItem('lane9_data', JSON.stringify(appData));
        }

        function setupEventListeners() {
            DOM.eventSelector.addEventListener('change', (e) => {
                appData.currentEvent = e.target.value;
                saveData();
                renderApp();
            });

            DOM.themeToggleBtn.addEventListener('click', toggleTheme);
            DOM.addEventBtn.addEventListener('click', openModal);
            DOM.cancelEventBtn.addEventListener('click', closeModal);
            DOM.saveEventBtn.addEventListener('click', createEvent);

            DOM.processDataBtn.addEventListener('click', handlePasteData);
            DOM.saveGoalBtn.addEventListener('click', saveGoal);
            DOM.clearDataBtn.addEventListener('click', clearCurrentEventData);
        }

        // --- Rendering Logic ---

        function renderApp() {
            const eventName = appData.currentEvent;
            const eventData = appData.events[eventName] || { times: [], goal: null };
            
            DOM.chartTitle.textContent = `${eventName} Progress`;
            
            // Sort times chronologically
            eventData.times.sort((a, b) => new Date(a.date) - new Date(b.date));

            // Calculate PB
            if (eventData.times.length > 0) {
                const pbSeconds = Math.min(...eventData.times.map(t => t.seconds));
                DOM.pbDisplay.textContent = formatTime(pbSeconds);
            } else {
                DOM.pbDisplay.textContent = '--:--.--';
            }

            // Render Goal
            if (eventData.goal) {
                DOM.goalDisplay.textContent = formatTime(eventData.goal.seconds);
                DOM.goalTimeInput.value = formatTime(eventData.goal.seconds);
                DOM.goalDateInput.value = eventData.goal.date.split('T')[0];
            } else {
                DOM.goalDisplay.textContent = '--:--.--';
                DOM.goalTimeInput.value = '';
                DOM.goalDateInput.value = '';
            }

            DOM.pasteArea.value = ''; // clear paste area
            renderChart(eventData);
            renderTable(eventData.times);
        }

        function populateEventSelector() {
            DOM.eventSelector.innerHTML = '';
            Object.keys(appData.events).forEach(ev => {
                const opt = document.createElement('option');
                opt.value = ev;
                opt.textContent = ev;
                if (ev === appData.currentEvent) opt.selected = true;
                DOM.eventSelector.appendChild(opt);
            });
        }

        function renderTable(times) {
            DOM.historyTbody.innerHTML = '';
            if (times.length === 0) {
                DOM.noDataMsg.classList.remove('hidden');
                return;
            }
            DOM.noDataMsg.classList.add('hidden');

            // Render latest first
            [...times].reverse().forEach(t => {
                const tr = document.createElement('tr');
                const d = new Date(t.date);
                const dateStr = d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
                
                tr.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap">${dateStr}</td>
                    <td class="px-4 py-3 font-semibold text-swim-primary">${t.time}</td>
                    <td class="px-4 py-3 hidden md:table-cell truncate max-w-[200px]" title="${t.meet}">${t.meet}</td>
                `;
                DOM.historyTbody.appendChild(tr);
            });
        }

        function renderChart(eventData) {
            const ctx = document.getElementById('progressChart').getContext('2d');
            
            const isDark = document.documentElement.classList.contains('dark');
            const tickColor = isDark ? '#cbd5e1' : '#64748b'; // slate-300 / slate-500
            const gridColor = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.1)';

            const timeData = eventData.times.map(t => ({
                x: new Date(t.date),
                y: t.seconds,
                meet: t.meet,
                timeStr: t.time
            }));

            const datasets = [{
                label: 'Race Times',
                data: timeData,
                borderColor: '#0284c7', // sky-600
                backgroundColor: 'rgba(2, 132, 199, 0.2)',
                borderWidth: 2,
                pointBackgroundColor: '#fff',
                pointBorderColor: '#0284c7',
                pointRadius: 4,
                pointHoverRadius: 6,
                fill: true,
                tension: 0.2
            }];

            // Add Goal Point if exists
            if (eventData.goal) {
                datasets.push({
                    label: 'Goal',
                    data: [{ x: new Date(eventData.goal.date), y: eventData.goal.seconds, timeStr: formatTime(eventData.goal.seconds) }],
                    borderColor: '#fbbf24', // amber-400
                    backgroundColor: '#fbbf24',
                    pointStyle: 'star',
                    pointRadius: 10,
                    pointHoverRadius: 12,
                    showLine: false
                });
            }

            if (progressChart) {
                progressChart.destroy();
            }

            progressChart = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: { unit: 'month' },
                            grid: { display: false },
                            ticks: { color: tickColor, font: { family: 'Inter' } }
                        },
                        y: {
                            type: 'linear',
                            reverse: true, // Lower times go up visually!
                            grid: { color: gridColor },
                            ticks: {
                                color: tickColor,
                                font: { family: 'Inter' },
                                callback: function(value) {
                                    return formatTime(value);
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const ds = context.dataset;
                                    const raw = context.raw;
                                    if (ds.label === 'Goal') return `Goal: ${raw.timeStr}`;
                                    return `${raw.timeStr} - ${raw.meet}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // --- Data Processing (The Core Logic) ---

        function handlePasteData() {
            const rawText = DOM.pasteArea.value;
            if (!rawText.trim()) return;

            const newTimes = parseSwimcloudText(rawText);
            
            if (newTimes.length === 0) {
                alert("Could not find valid Swimcloud time formats in the pasted text. Make sure you copy the whole row including Date.");
                return;
            }

            const current = appData.events[appData.currentEvent];
            
            // Merge, avoiding strict duplicates (same date, same time, same meet)
            newTimes.forEach(nt => {
                const exists = current.times.some(et => 
                    et.time === nt.time && 
                    et.date === nt.date && 
                    et.meet === nt.meet
                );
                if (!exists) {
                    current.times.push(nt);
                }
            });

            saveData();
            renderApp();
            
            // Visual feedback
            const btn = DOM.processDataBtn;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i>Added!';
            btn.classList.add('bg-green-500');
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('bg-green-500');
            }, 2000);
        }

        function parseSwimcloudText(text) {
            const lines = text.trim().split('\n');
            const results = [];
            // Matches dates like "Feb 21, 2026", "Oct 12, 2024"
            const dateRegex = /(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2},\s+\d{4}$/i;
            // Matches time formats like "25.41", "1:05.41", "10:45.99"
            const timeRegex = /^(\d{1,2}:)?\d{1,2}\.\d{2}/;

            lines.forEach(line => {
                let cleanLine = line.trim();
                if (!cleanLine) return;

                // Split by tabs (standard for table copies) or multiple spaces
                let parts = cleanLine.split(/\t+/).map(p => p.trim()).filter(p => p);
                
                // Fallback for space-separated if tabs are lost, but only if we can clearly identify pieces
                if (parts.length < 3) {
                     // Try to match time at start and date at end manually
                     const tMatch = cleanLine.match(timeRegex);
                     const dMatch = cleanLine.match(dateRegex);
                     if (tMatch && dMatch) {
                         const time = tMatch[0];
                         const date = dMatch[0];
                         let meet = cleanLine.substring(time.length, cleanLine.length - date.length).trim();
                         // Remove XR flags
                         meet = meet.replace(/^(X|R|XR|x|r|xr)\s+/, '').trim();
                         
                         results.push({
                             time: time,
                             seconds: timeToSeconds(time),
                             meet: meet || 'Unknown Meet',
                             date: new Date(date).toISOString()
                         });
                     }
                     return;
                }

                let timeStr = parts[0];
                if (!timeRegex.test(timeStr)) return;

                let dateStr = parts[parts.length - 1];
                if (!dateRegex.test(dateStr)) return;

                // Combine everything between time and date as the meet name
                let meetStr = parts.slice(1, parts.length - 1).join(' ');
                
                // Clean up Swimcloud tags (X = Exhibition, R = Relay Lead, XR = Exhibition Relay)
                meetStr = meetStr.replace(/^(X|R|XR|x|r|xr)\s+/, '').trim();

                results.push({
                    time: timeStr,
                    seconds: timeToSeconds(timeStr),
                    meet: meetStr,
                    date: new Date(dateStr).toISOString()
                });
            });
            
            return results;
        }

        function saveGoal() {
            const timeVal = DOM.goalTimeInput.value.trim();
            const dateVal = DOM.goalDateInput.value;

            if (!timeVal || !dateVal) {
                alert("Please enter both a target time and date.");
                return;
            }

            const seconds = timeToSeconds(timeVal);
            if (isNaN(seconds) || seconds <= 0) {
                alert("Invalid time format. Use MM:SS.ms (e.g., 1:05.50) or SS.ms (e.g., 25.41)");
                return;
            }

            // Create ISO string for noon of that date to avoid timezone offset issues pushing it to previous day
            const d = new Date(dateVal + 'T12:00:00Z');

            appData.events[appData.currentEvent].goal = {
                time: timeVal,
                seconds: seconds,
                date: d.toISOString()
            };

            saveData();
            renderApp();
            
            // Visual feedback
            const btn = DOM.saveGoalBtn;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Saved!';
            btn.classList.replace('bg-slate-800', 'bg-green-500');
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.replace('bg-green-500', 'bg-slate-800');
            }, 2000);
        }

        function clearCurrentEventData() {
            if(confirm(`Are you sure you want to delete all times and goals for ${appData.currentEvent}?`)) {
                appData.events[appData.currentEvent] = { times: [], goal: null };
                saveData();
                renderApp();
            }
        }

        // --- Event Modal Logic ---

        function openModal() {
            DOM.modal.classList.remove('hidden');
            // Slight delay for animation to trigger
            requestAnimationFrame(() => {
                DOM.modal.classList.remove('opacity-0');
                DOM.modalContent.classList.remove('scale-95');
                DOM.newEventInput.focus();
            });
        }

        function closeModal() {
            DOM.modal.classList.add('opacity-0');
            DOM.modalContent.classList.add('scale-95');
            setTimeout(() => {
                DOM.modal.classList.add('hidden');
                DOM.newEventInput.value = '';
            }, 200);
        }

        function createEvent() {
            const evName = DOM.newEventInput.value.trim();
            if (!evName) return;
            
            if (!appData.events[evName]) {
                appData.events[evName] = { times: [], goal: null };
            }
            
            appData.currentEvent = evName;
            saveData();
            populateEventSelector();
            closeModal();
            renderApp();
        }

        // --- Utility Functions ---

        function timeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.toString().split(':');
            if (parts.length === 2) {
                return (parseInt(parts[0], 10) * 60) + parseFloat(parts[1]);
            }
            return parseFloat(parts[0]);
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === 0) return "--:--.--";
            if (seconds < 60) return seconds.toFixed(2);
            
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(2);
            // Ensure secs has leading zero if needed (e.g., 1:05.40 instead of 1:5.40)
            const formattedSecs = secs.length < 5 ? `0${secs}` : secs; 
            return `${mins}:${formattedSecs}`;
        }

        // Start
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
